{% extends "base.html" %}
{% block title %}Transmission reçue — Portail sécurisé{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 text-center">
  <svg class="mx-auto w-10 h-10 text-green-600" fill="none" stroke="currentColor"
       stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
  </svg>
  <h2 class="mt-3 text-lg font-semibold text-gray-900">Transmission reçue</h2>
  <p class="mt-2 text-sm text-gray-600">
    Votre transmission a été reçue. Un accusé de réception vous sera transmis
    par courriel.
  </p>
  <p class="mt-4 text-xs text-gray-400">Vous pouvez fermer cette page.</p>
</div>
{% endblock %}
