# OSV-Scanner configuration — https://google.github.io/osv-scanner/configuration/
#
# Referenced explicitly by .github/workflows/osv-scanner.yml
# (`--config=athena/osv-scanner.toml`), so this file must exist even when it
# suppresses nothing. The workflow is a BLOCKING check: it exits non-zero on
# any finding, and only vulnerabilities listed below are exempted.
#
# ── Currently: NO suppressions. ──────────────────────────────────────────
#
# This file used to carry three entries (PYSEC-2026-3447 / CVE-2026-59890 /
# GHSA-h35f-9h28-mq5c) for a setuptools sdist-packaging bug that was
# unreachable here. They were removed on 2026-07-30 when the OpenTelemetry
# stack moved to api/sdk 1.44.0 + instrumentation 0.65b0: contrib dropped its
# `pkg_resources` dependency at 0.49b0, which let the deliberate
# `setuptools<81` constraint go — and with it setuptools left the dependency
# graph entirely (its only two sources were that constraint and
# opentelemetry-instrumentation). The advisory stopped being reported on all
# three surfaces at once rather than being silenced on each.
#
# Adding a suppression here is a real decision, not routine hygiene. If you
# add one:
#   • state WHY the vulnerable code path is unreachable in THIS deployment,
#     and make the reason load-bearing (an OS or platform caveat in the
#     advisory usually is NOT the reason — an absent code path is);
#   • list every alias (OSV keys some advisories as PYSEC while the SARIF
#     alert shows the CVE), or the ignore will not match;
#   • remember this file silences OSV-Scanner ONLY. Dependabot does not read
#     it, and Trivy has been observed filing the same advisory as a
#     code-scanning alert regardless of its CRITICAL,HIGH severity filter.
#     Each surface is dismissed separately, and they drift apart silently.
