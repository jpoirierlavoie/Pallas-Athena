runtime: python313
instance_class: F2
automatic_scaling:
  # min_instances: 0 trades a cold start after idle (Flask + firebase_admin +
  # OTel imports, several seconds) for zero standing cost. Warmup requests
  # below soften this. Set min_instances: 1 to eliminate cold starts entirely
  # at the cost of one always-on F2 instance.
  min_instances: 0
  max_instances: 2
  target_cpu_utilization: 0.65

# Ask App Engine to send /_ah/warmup before routing live traffic to a new
# instance (handled in main.py; primes Firebase/Firestore clients).
inbound_services:
  - warmup

# Explicit worker/thread/timeout sizing: gunicorn's defaults (1 sync worker,
# 30 s timeout) cap the whole app at ~2 concurrent requests across instances
# and SIGKILL slow DAV/dashboard requests. Threads overlap Firestore I/O.
entrypoint: gunicorn -b :$PORT --workers 2 --threads 4 --timeout 60 --graceful-timeout 30 main:app

env_variables:
  ENV: "production"
  FIREBASE_PROJECT_ID: "athena-pallas"
  FIREBASE_APP_ID: "1:1073430388324:web:6d60d0d67d74ce1b730971"
  FIREBASE_STORAGE_BUCKET: "athena-pallas.firebasestorage.app"
  AUTHORIZED_USER_EMAIL: "jason@poirierlavoie.ca"
  # Firm identity — compliance signer (prefixed "Me " if absent), invoice
  # header, and the budget-PDF footer (public coordinates — not secrets).
  # GST_NUMBER/QST_NUMBER stay unset until invoicing needs them.
  FIRM_NAME: "Me Jason Poirier Lavoie"
  # Support channel shown to a stuck portal client (invitation email + portal
  # footer) — a client who exhausts the resend cap gets no distinct message
  # (anti-enumeration), so a reachable number is the fallback that matters.
  FIRM_PHONE: "(514) 737-2525"
  FIRM_STREET: "4970, chemin de la Côte-des-Neiges"
  FIRM_UNIT: "suite 9"
  FIRM_CITY: "Montréal"
  FIRM_POSTAL_CODE: "H3V 1A4"
  FIRM_EMAIL: "reception@poirierlavoie.ca"
  FIRM_FAX: "(514) 737-6565"
  RECAPTCHA_ENTERPRISE_SITE_KEY: "6LeR9Y0sAAAAAJhkKWa_wYdbproZUQFjEO7FkfEb"
  REQUIRE_MFA: "true"
  # MCP connector (Phase I) kill switch — set "false" to 404 every
  # /mcp + /oauth/* route. MCP_CANONICAL_ORIGIN defaults to
  # https://athena.poirierlavoie.ca in config.py.
  MCP_ENABLED: "true"
  # The SECOND kill switch: "false" removes every write tool from
  # tools/list, refuses it at tools/call, and hides the consent checkbox —
  # reads are untouched. It was absent from this file until lot Q and so ran
  # on the config.py default ("true"), which meant the switch existed in code
  # and could not actually be flipped without a code change. State it
  # explicitly, both to make the effective value readable and to give the
  # arm/disarm procedure something to edit.
  #
  # ARM IT ("false") BEFORE deploying a lot that WIDENS the write surface.
  # A scope is frozen at issuance, so a token granted under an older consent
  # screen keeps working — and would silently reach the new tools the moment
  # they deploy, under a screen that never described them.
  #
  # ARM IT ("false") BEFORE deploying a lot that WIDENS the write surface.
  # A scope is frozen at issuance, so a token granted under an older consent
  # screen keeps working and would silently reach the new tools the moment
  # they deploy, under a screen that never described them.
  #
  # THE ORDER IS NOT OBVIOUS, AND GETTING IT WRONG COSTS A ROUND TRIP.
  # This switch does DOUBLE DUTY: it refuses the write tools, and it also
  # sets `write_offered` (mcp/oauth.py), which gates BOTH the « Écritures »
  # block and the « Autoriser les écritures » checkbox in
  # templates/mcp/consent.html. While it is armed the consent screen shows
  # no write section at all — so re-consenting under it silently yields a
  # READ-ONLY grant. That happened on 2026-08-17 during lot Q.
  #
  #   1. arm ("false") + deploy the widening lot  → new tools land dead
  #   2. revoke every token (scripts.revoke_mcp_tokens) → nothing holds a grant
  #   3. DISARM ("true") + deploy  → the checkbox comes back
  #   4. only now: re-add the connector in claude.ai and tick the box
  #
  # Step 3 before step 4 is the part that is easy to get backwards. It is
  # safe because step 2 already left no token to escalate.
  MCP_WRITE_ENABLED: "true"
  # Cloud Trace resource labels (instance, zone, service). Since OTel SDK
  # 1.42 (PR #5145) resource detectors are loaded ONLY when this is set —
  # Google's migration guide still claims the GCP detector is picked up
  # automatically, which is FALSE on 1.42+, and the failure is silent (no
  # GCP labels, no error). Unset here until 2026-07-30, so traces carried
  # no GCP resource attributes at all.
  OTEL_EXPERIMENTAL_RESOURCE_DETECTORS: "gcp"
  # OTLP export deadline, in SECONDS (the SDK reads this one directly, unlike
  # OTEL_EXPORTER_OTLP_PROTOCOL which only applies under `opentelemetry-
  # instrument`). The default is 10 s and the exporter retries up to 6 times
  # with exponential backoff, so a telemetry.googleapis.com outage could hold
  # the batch thread well past gunicorn's 30 s --graceful-timeout during a
  # shutdown — App Engine would SIGKILL the instance mid-flush. Tracing is
  # best-effort; serving is not.
  OTEL_EXPORTER_OTLP_TIMEOUT: "5"
  # Microsoft Graph — outbound email (portail client L1; reused by phase J).
  # Non-secret identifiers; GRAPH_CLIENT_SECRET comes from Secret Manager
  # (graph-client-secret). MAIN SERVICE ONLY — never in portail.yaml.
  GRAPH_TENANT_ID: "4c5c39a5-2e63-4b04-8408-973c58cd88c7"
  GRAPH_CLIENT_ID: "988bf117-3aef-463b-8062-7dac226e50d9"
  GRAPH_SENDER_UPN: "reception@poirierlavoie.ca"
  # Nom d'affichage du from — sans lui, les clients voient le nom d'annuaire
  # de la boîte hôte de l'alias (« Jason Poirier Lavoie »). Si Exchange
  # réécrit ce nom malgré tout, voir la note dans config.py (boîte partagée).
  GRAPH_SENDER_NAME: "Réception — Poirier Lavoie, avocat"
  # Bookings sync (phase L2) — imports « Bookings with me » reservations from
  # this mailbox as hearings gated behind confirmation="à_confirmer". Same
  # Graph app registration (Calendars.ReadWrite added in Entra).
  # BOOKINGS_JURISTE_UPN is the polled mailbox (the juriste's, NOT the
  # reception@ send-as alias).
  #
  # One keyword per published Bookings service. Bookings names the event
  # « {Customer} - {Service} », so the keyword must END the subject: the
  # predicate is ANCHORED on « {séparateur} {mot-clé} », not a substring.
  # That anchor is load-bearing — the polled mailbox is the juriste's own, so
  # every event he creates himself carries the same organizer as a real
  # reservation, and the keyword is the ONLY discriminant. A substring match
  # on « Réunion » would pull « Réunion d'équipe » into the review queue,
  # where refusing CANCELS the real Outlook meeting.
  # Each keyword also needs an entry in Config.BOOKINGS_TYPE_PAR_MOT_CLE, or
  # the import falls back to « consultation » (logged, never silent).
  # ⚠️ An EMPTY value disables the predicate entirely — the sync then imports
  # nothing and the absence loop flags existing reservations as cancelled.
  BOOKINGS_JURISTE_UPN: "jason@poirierlavoie.ca"
  BOOKINGS_SUBJECT_KEYWORDS: "Consultation,Rencontre"
  BOOKINGS_SYNC_ACTIVE: "true"
  # Miroir Outlook — pousse les audiences confirmées d'Athéna dans le
  # calendrier PRINCIPAL du juriste (elles bloquent alors les créneaux
  # « Bookings with me »). Unidirectionnel, Athéna fait autorité ; anti-boucle
  # par propriété étendue + catégorie « Pallas Athéna » (utils/graph_miroir).
  # "false" gèle les miroirs en place (aucun nettoyage automatique).
  MIROIR_OUTLOOK_ACTIF: "true"
  FEATURE_INTAKE: "true"
  PIP_REQUIRE_HASHES: "1"
  PIP_NO_DEPS: "1"
  # Secrets (SECRET_KEY, FIREBASE_API_KEY, DAV_PASSWORD_HASH, GRAPH_CLIENT_SECRET)
  # are pulled from Google Cloud Secret Manager at runtime — see config.py.

# Static handlers bypass Flask's after_request security headers, so each one
# repeats the baseline. The rule is deliberately TOTAL — every handler carries
# `secure: always` + nosniff + HSTS, with no "HTML and scripts only" carve-out.
# An exception list is a list that decays: /sw.js and /manifest.json sat
# without HSTS or `secure: always` for months precisely because they fell
# outside one. tests/test_security_headers.py now derives the inventory from
# this file and enforces it, so a new handler cannot quietly skip the baseline.
handlers:
  - url: /manifest.json
    static_files: manifest.json
    upload: manifest.json
    mime_type: application/manifest+json
    secure: always
    http_headers:
      X-Content-Type-Options: nosniff
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  - url: /sw.js
    static_files: static/sw.js
    upload: static/sw.js
    mime_type: application/javascript
    secure: always
    http_headers:
      Cache-Control: no-cache
      Service-Worker-Allowed: /
      X-Content-Type-Options: nosniff
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  - url: /favicon.ico
    static_files: static/icons/favicon.ico
    upload: static/icons/favicon.ico
    mime_type: image/x-icon
    secure: always
    http_headers:
      X-Content-Type-Options: nosniff
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  - url: /robots.txt
    static_files: robots.txt
    upload: robots.txt
    mime_type: text/plain
    secure: always
    http_headers:
      X-Content-Type-Options: nosniff
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  - url: /apple-touch-icon-precomposed.png
    static_files: static/icons/icon-192.png
    upload: static/icons/icon-192.png
    mime_type: image/png
    secure: always
    http_headers:
      X-Content-Type-Options: nosniff
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  - url: /apple-touch-icon.png
    static_files: static/icons/icon-192.png
    upload: static/icons/icon-192.png
    mime_type: image/png
    secure: always
    http_headers:
      X-Content-Type-Options: nosniff
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  - url: /privacy
    static_files: static/legal/privacy.html
    upload: static/legal/privacy.html
    mime_type: text/html
    secure: always
    http_headers:
      X-Content-Type-Options: nosniff
      X-Frame-Options: DENY
      Referrer-Policy: strict-origin-when-cross-origin
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  - url: /terms
    static_files: static/legal/terms.html
    upload: static/legal/terms.html
    mime_type: text/html
    secure: always
    http_headers:
      X-Content-Type-Options: nosniff
      X-Frame-Options: DENY
      Referrer-Policy: strict-origin-when-cross-origin
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  # Vendored fonts need an explicit MIME type: .woff2 is absent from the
  # runtime's default map (it would serve as application/octet-stream) and
  # every static handler sets nosniff, so the browser would refuse the font.
  # mime_type cannot go on the static_dir handler below (it would force ONE
  # type onto the CSS/JS too) — hence this handler, which MUST stay ABOVE
  # /static/vendor (first match wins).
  - url: /static/vendor/(.*\.woff2)$
    static_files: static/vendor/\1
    upload: static/vendor/.*\.woff2$
    mime_type: font/woff2
    secure: always
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"
      X-Content-Type-Options: nosniff
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  # Vendored assets carry their version/hash in the filename and are therefore
  # immutable: cache for a year. HARD RULE — a changed asset MUST get a new
  # filename; never edit a vendor file in place.
  - url: /static/vendor
    static_dir: static/vendor
    secure: always
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"
      X-Content-Type-Options: nosniff
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  # Other static files (icons, owl.png, legal pages) are NOT version-named, so
  # they get a moderate lifetime instead of immutable.
  - url: /static
    static_dir: static
    secure: always
    http_headers:
      Cache-Control: "public, max-age=86400"
      X-Content-Type-Options: nosniff
      Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"

  - url: /.*
    script: auto
    secure: always
